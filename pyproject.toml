[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "rfp-compliance-matrix"
version = "0.1.0"
description = "Local source-linked RFP review, durable human decisions, and deterministic compliance matrices"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Roy Harden"}]
dependencies = ["pydantic>=2,<3", "pdfplumber>=0.11,<0.12"]

[project.optional-dependencies]
graph = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]
typesafe = ["typesafe-sdk==0.7.5"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
web = ["fastapi>=0.115,<1", "jinja2>=3.1,<4", "uvicorn>=0.30,<1"]
test = ["rfp-compliance-matrix[dev,web,graph]"]

[project.scripts]
rfp-matrix = "rfp_matrix.cli:main"

[tool.hatch.build]
exclude = [
    "**/*.bak-*", "**/__pycache__/**", "**/*.pyc", "**/*.pyo",
    ".agent-work/**", ".venv/**", ".pytest_cache/**", "dist/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rfp_matrix"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
